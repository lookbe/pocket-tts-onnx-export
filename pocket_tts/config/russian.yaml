weights_path: hf://genvoice/xVibePocketTTS/model/model.safetensors@v0.1.0
default_temperature: 0.5
# Word-timestamp head for these weights. Picked by the C++ word-boundary check, not by the probe score alone: the probe ranks
# L3H7 first (0.935, span-limited) but its word boundaries are poor; L3H8 (probe 0.829-1.000) gives silent gaps between words
# (RMS 0.0001) and sane durations. Exporters emit `ts_logits` when this is set.
timestamp_heads:
- layer: 3
  head: 8

flow_lm:
  insert_bos_before_voice: true
  dtype: float32
  flow:
    depth: 6
    dim: 512
  transformer:
    d_model: 1024
    hidden_scale: 4
    max_period: 10000
    num_heads: 16
    num_layers: 6
  lookup_table:
    dim: 1024
    n_bins: 5000
    tokenizer: sentencepiece
    tokenizer_path: hf://genvoice/xVibePocketTTS/model/tokenizer.model@v0.1.0
mimi:
  dtype: float32
  sample_rate: 24000
  inner_dim: 32
  outer_dim: 512
  channels: 1
  frame_rate: 12.5
  seanet:
    dimension: 512
    channels: 1
    n_filters: 64
    n_residual_layers: 1
    ratios:
    - 6
    - 5
    - 4
    kernel_size: 7
    residual_kernel_size: 3
    last_kernel_size: 3
    dilation_base: 2
    pad_mode: constant
    compress: 2
  transformer:
    d_model: 512
    num_heads: 8
    num_layers: 2
    layer_scale: 0.01
    context: 250
    dim_feedforward: 2048
    input_dimension: 512
    output_dimensions:
    - 512
  quantizer:
    dimension: 32
    output_dimension: 512
