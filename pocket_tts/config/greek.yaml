# Greek (el) including Cypriot Greek, 6-layer student distilled from greek_24l.
#
# Fill the two weights paths in after distillation; everything else is final.
#
# Text handling is where Greek differs from the shipped languages, and both differences are
# load-bearing:
#
#   remove_semicolons is deliberately absent. It defaults to false, and French and German set it
#   true because ";" is weak punctuation for them. In Greek ";" IS the question mark, and that
#   option is implemented as text.replace(";", ","), so setting it would turn every question into
#   a statement and strip the intonation cue the model is trained on.
#
#   append_terminal_punctuation is false for the same reason, and it is the one that actually
#   bites: leaving remove_semicolons alone is not enough. _ensure_terminal_punctuation() in
#   pocket_tts/models/text_chunking.py classifies ";" as _WEAK_PUNCTUATION (",;:-–—") rather than
#   _TERMINAL_PUNCTUATION (".!?…"), so a prompt ending in ";" takes the weak branch and becomes
#   core.rstrip(_WEAK_PUNCTUATION) + "." -- "Τι κάνεις;" renders as "Τι κάνεις." The cost of
#   switching it off is that prompts with no final punctuation no longer get a period added, which
#   upstream added because the last word is otherwise mispronounced or repeated. The better fix is
#   to make those two sets language-aware upstream; until then this is the safe setting.
#
# capitalize_first_letter stays true: Greek is a cased script and the convention holds.
# Digits are kept rather than normalised -- there is no inference-time normaliser, so the model
# learns to read them.

weights_path: hf://myned-ai/pocket-tts-greek/model.safetensors
weights_path_without_voice_cloning: null

append_terminal_punctuation: false

# 0.3 as for Kyutai's English model (the fallback is 0.7). Measured on the 8 published voices x 10
# sentences: 0.3 vs 0.7 gives quality 3.73 vs 3.61, word errors 0.056 vs 0.066, and fewer outlier
# sentences; questions rise a little less (+3.2 vs +3.8 semitones). Raise it for livelier delivery.
default_temperature: 0.3

# Word-timestamp head(s) for these weights, found by scripts/find_timestamp_heads.py (worst-seed score 0.980). Exporters emit `ts_logits` when this is set.
timestamp_heads:
- layer: 3
  head: 9

flow_lm:
  insert_bos_before_voice: true
  dtype: float32
  flow:
    depth: 6
    dim: 512
  transformer:
    d_model: 1024
    hidden_scale: 4
    max_period: 10000
    num_heads: 16
    num_layers: 6
  lookup_table:
    dim: 1024
    n_bins: 4000
    tokenizer: sentencepiece            # the Greek tokenizer is a SentencePiece .model, not a tokenizer.json
    tokenizer_path: hf://myned-ai/pocket-tts-greek/tokenizer.model

mimi:
  dtype: float32
  sample_rate: 24000
  inner_dim: 32
  outer_dim: 512
  channels: 1
  frame_rate: 12.5
  seanet:
    dimension: 512
    channels: 1
    n_filters: 64
    n_residual_layers: 1
    ratios:
    - 6
    - 5
    - 4
    kernel_size: 7
    residual_kernel_size: 3
    last_kernel_size: 3
    dilation_base: 2
    pad_mode: constant
    compress: 2
  transformer:
    d_model: 512
    num_heads: 8
    num_layers: 2
    layer_scale: 0.01
    context: 250
    dim_feedforward: 2048
    input_dimension: 512
    output_dimensions:
    - 512
  quantizer:
    dimension: 32
    output_dimension: 512
